version: '3.9'

name: microservice-cinema

services:
  auth-service:
    container_name: auth-service
    image: microservice-cinema/auth-service:dev
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env.production.local
    networks:
      - microservice-cinema

networks:
  microservice-cinema:
    external: true